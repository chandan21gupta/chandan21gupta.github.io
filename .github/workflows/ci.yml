name: CI

on:
  push:
    branches:
    - master
    - main
  pull_request:
    branches:
    - master
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.2.1
      with:
        hugo-version: latest

    - name: Build personal site
      run: hugo --minify --gc

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: ./public

